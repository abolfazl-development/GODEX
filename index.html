              'fluid': 'cubic-bezier(0.32, 0.72, 0, 1)',

    <style>
      /* --- GLOBAL RESET & PHYSICS --- */
      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      
      html, body {
        width: 100%;
        /* Use Dynamic Viewport Height for mobile address bar stability */
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        /* Crucial: prevents native swipe navigations and bounce effects that fight Lenis */
        overscroll-behavior: none; 
        /* Optimization: Tells browser we only handle vertical scrolling, optimizing touch response */
        touch-action: pan-y;
        background-color: #f8fafc;
        overflow-x: hidden;
      }

      body {
        font-family: 'Vazirmatn', sans-serif;
        /* NO GLOBAL TRANSFORM on body to keep position:fixed working properly */
      }
      
      * {
        box-sizing: border-box;
      }

      /* Prevent image dragging which causes scroll jank on touch/mouse-drag */
      img {
        -webkit-user-drag: none;
        -khtml-user-drag: none;
        -moz-user-drag: none;
        -o-user-drag: none;
        user-drag: none;
        pointer-events: none; /* Let clicks pass through to parent unless specific */
      }
      
      /* Re-enable pointer events for specific interactive images if needed, 
         but for cards, we usually want the card to be the click target */
      .interactive-img {
        pointer-events: auto;
      }

      /* --- LENIS & SCROLLBAR --- */
      html.lenis, html.lenis body { height: auto; }
      .lenis.lenis-smooth { scroll-behavior: auto !important; }
      .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
      .lenis.lenis-stopped { overflow: hidden; }
      .lenis.lenis-scrolling iframe { pointer-events: none; }

      ::-webkit-scrollbar { width: 0px; background: transparent; }

      html.dark body { background-color: #020617; }
      
      /* --- OPTIMIZED LAYERS --- */
      /* Helper classes for manual layer promotion */
      .transform-gpu {
        transform: translate3d(0, 0, 0);
      }
      
      .backface-hidden {
        backface-visibility: hidden;
      }

      .fixed-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        /* Enforce layer creation for background */
        transform: translateZ(0); 
      }

      /* --- PERFORMANCE: FAST SCROLL OPTIMIZATION --- */
      /* When scrolling fast, disable pointer events on main content to avoid expensive hover/hit-testing */
      body.is-scrolling-fast main {
        pointer-events: none;
      }
      
      /* Optional: Reduce visual fidelity during fast scroll if needed (e.g. blur) 
      body.is-scrolling-fast .backdrop-blur-xl {
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
      }
      */

      /* --- CENTRALIZED ANIMATION PHYSICS --- */
      /* Defines the standard interactive feel for buttons/links */
      .physics-interactive {
        transition-property: all;
        transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1); 
        transition-duration: 700ms;
        transform: translateZ(0);
      }
      
      /* Defines the standard card feel - ULTRA SMOOTH */
      .card-interactive {
        transition-property: transform, box-shadow, background-color, border-color, opacity;
        transition-duration: 1000ms; 
        transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
        transform: translateZ(0);
        will-change: transform; /* Hint to browser to prioritize this layer */
        backface-visibility: hidden;
      }

      .card-interactive:hover {
        transform: scale(1.025) translateY(-8px);
        z-index: 10;
      }

      /* --- SCROLL REVEAL SYSTEM WITH FASTER MOTION BLUR --- */
      .reveal-base {
        opacity: 0;
        transform: translate3d(0, 30px, 0) scale(0.98);
        filter: blur(4px); 
        will-change: opacity, transform; /* Removed filter from will-change to save memory */
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                    transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                    filter 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      
      .reveal-visible {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
        filter: blur(0px);
      }

      /* --- VIEW TRANSITIONS --- */
      ::view-transition-group(root) { animation-duration: 1.2s; }
      
      ::view-transition-old(root),
      ::view-transition-new(root) {
        mix-blend-mode: normal;
      }
    </style>
